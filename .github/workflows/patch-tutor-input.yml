name: Patch Tutor Input Contrast

on:
  push:
    branches: [android-mvp]
    paths:
      - '.github/workflows/patch-tutor-input.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mvp
      - name: Improve AI tutor text field contrast
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/manso/hangeulai/MainActivity.kt')
          s = p.read_text()
          old_import = 'import androidx.compose.material3.OutlinedTextField\n'
          new_import = old_import + 'import androidx.compose.material3.OutlinedTextFieldDefaults\n'
          if 'OutlinedTextFieldDefaults' not in s:
              s = s.replace(old_import, new_import)

          old = '''                OutlinedTextField(\n                    value = question,\n                    onValueChange = { question = it },\n                    label = { Text("AI 튜터에게 질문") },\n                    modifier = Modifier.fillMaxWidth()\n                )'''
          new = '''                OutlinedTextField(\n                    value = question,\n                    onValueChange = { question = it },\n                    label = { Text("AI 튜터에게 질문") },\n                    modifier = Modifier.fillMaxWidth(),\n                    colors = OutlinedTextFieldDefaults.colors(\n                        focusedTextColor = Color.White,\n                        unfocusedTextColor = Color.White,\n                        cursorColor = Color.White,\n                        focusedBorderColor = Purple,\n                        unfocusedBorderColor = Color(0xFF57535F),\n                        focusedLabelColor = Color(0xFFCFC5FF),\n                        unfocusedLabelColor = Color(0xFFB7B4BE)\n                    )\n                )'''
          if old not in s:
              raise SystemExit('Target OutlinedTextField block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/manso/hangeulai/MainActivity.kt
          git commit -m 'Fix AI tutor input text contrast'
          git push origin HEAD:android-mvp
