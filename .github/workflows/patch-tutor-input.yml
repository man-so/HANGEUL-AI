name: Patch Tutor Route

on:
  push:
    branches: [android-mvp]
    paths:
      - '.github/workflows/patch-tutor-input.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mvp
      - name: Route tutor tab to Gemma screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/manso/hangeulai/MainActivity.kt')
          s = p.read_text()
          old = 'AppTab.Tutor -> TutorScreen(sampleLesson)'
          new = 'AppTab.Tutor -> AiTutorScreen(sampleLesson)'
          if old not in s:
              raise SystemExit('Tutor route target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/manso/hangeulai/MainActivity.kt
          git commit -m 'Connect tutor tab to on-device Gemma screen'
          git push origin HEAD:android-mvp
