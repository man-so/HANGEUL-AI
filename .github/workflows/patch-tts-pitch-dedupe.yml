name: Patch TTS Pitch and Dedupe

on:
  push:
    branches: [android-mvp]
    paths:
      - '.github/workflows/patch-tts-pitch-dedupe.yml'
      - 'scripts/patch_tts_pitch_dedupe.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mvp
      - name: Apply TTS patch
        run: python scripts/patch_tts_pitch_dedupe.py
      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/manso/hangeulai/MainActivity.kt
          git commit -m 'Lower Korean TTS pitch and reduce duplicate voices'
          git push origin HEAD:android-mvp
