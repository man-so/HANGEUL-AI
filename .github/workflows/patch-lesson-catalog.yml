name: Patch Lesson Catalog

on:
  push:
    branches: [android-mvp]
    paths:
      - '.github/workflows/patch-lesson-catalog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mvp
      - name: Integrate lesson catalog
        run: python scripts/integrate_lessons.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/manso/hangeulai/MainActivity.kt
          git commit -m 'Integrate Infinite Challenge lesson catalog'
          git push origin HEAD:android-mvp
